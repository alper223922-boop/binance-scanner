name: Binance Scanner
 
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
 
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
 
      - name: API erisim testi
        run: |
          echo "=== Binance ==="
          curl -s -o /dev/null -w "%{http_code}" https://fapi.binance.com/fapi/v1/ping
          echo ""
          echo "=== Bybit ==="
          curl -s -o /dev/null -w "%{http_code}" https://api.bybit.com/v3/public/time
          echo ""
          echo "=== OKX ==="
          curl -s -o /dev/null -w "%{http_code}" https://www.okx.com/api/v5/public/time
          echo ""
          echo "=== Gate.io ==="
          curl -s -o /dev/null -w "%{http_code}" https://api.gateio.ws/api/v4/futures/usdt/contracts?limit=1
          echo ""
 
      - name: Python kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
 
      - name: Bagimliliklar
        run: pip install -r requirements.txt
 
      - name: Scanner calistir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_INTERVAL: "0"
          TIMEFRAME: "1h"
          MIN_VOLUME_USDT: "5000000"
          PYTHONIOENCODING: "utf-8"
          BINANCE_PROXY: "https://binance-proxy.alper223922.workers.dev"
        run: python scanner.py
